<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Stats - Kollect</title>
    <meta name="description" content="Live download statistics for Kollect binaries across every GitHub release.">
    <script>
        (function () {
            var t;
            try { t = localStorage.getItem('theme'); } catch (e) { t = null; }
            if (t !== 'dark' && t !== 'light') {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-container">
                <div class="nav-brand">
                    <a href="index.html" style="display:flex; align-items:center; text-decoration:none; color:inherit;">
                        <img src="assets/Kollect.png" class="site-logo" data-logo-light="assets/Kollect.png" data-logo-dark="assets/dark_Kollect.png" alt="Kollect" style="height: 32px; margin-right: 8px;">
                        <span>Kollect</span>
                    </a>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html#platforms">Platforms</a></li>
                    <li><a href="index.html#download">Download</a></li>
                    <li><a href="docs/getting-started.html">Docs</a></li>
                    <li><a href="stats.html">Stats</a></li>
                    <li><a href="https://github.com/MichaelCade/kollect-web" target="_blank">GitHub</a></li>
                    <li class="nav-toggle-item"><button class="theme-toggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="stats-main">
        <div class="container">
            <h1>Download Stats</h1>
            <p class="stats-sub">
                Binary downloads per GitHub release, live from
                <a href="https://github.com/MichaelCade/kollect-web/releases" target="_blank" rel="noopener">MichaelCade/kollect-web</a>.
            </p>
            <div id="stats-content">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading download stats...</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <img src="assets/Kollect.png" class="site-logo" data-logo-light="assets/Kollect.png" data-logo-dark="assets/dark_Kollect.png" alt="Kollect" style="height: 24px; margin-right: 8px;">
                    <span>Kollect</span>
                </div>
                <div class="footer-links">
                    <a href="https://github.com/MichaelCade/kollect-web">GitHub</a>
                    <a href="index.html">Home</a>
                    <a href="index.html#download">Download</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Kollect. Open source infrastructure discovery tool.</p>
            </div>
        </div>
    </footer>

    <script src="assets/theme.js"></script>
    <script src="assets/stats.js"></script>
</body>
</html>
